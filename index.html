<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRM 노무관리파트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="inspection.css?v=20261023-2">
<style id="app-style">
  :root{
    --ink-900:#17212b; --ink-700:#2c3946; --ink-500:#5b6b78; --ink-300:#96a3ac;
    --paper-0:#f4f1e9; --paper-50:#fbfaf5; --surface:#ffffff;
    --line:#ddd6c4; --line-soft:#e8e3d4;
    --accent-900:#0c463f; --accent-700:#116a5c; --accent-500:#178a77; --accent-100:#e2ede9; --accent-050:#eef4f1;
    --cat-insp:#116a5c; --cat-insp-bg:#e2ede9;
    --cat-leave:#2f5d8a; --cat-leave-bg:#e3ebf4;
    --cat-att:#8f6108;  --cat-att-bg:#f6ecd3;
    --danger-700:#9c2b22; --danger-100:#f7e3df;
    --warn-700:#8f6108;  --warn-100:#f6ecd3;
    --good-700:#276b46;  --good-100:#e1f0e6;
    --shadow: 0 1px 2px rgba(23,33,43,.06), 0 6px 20px -8px rgba(23,33,43,.12);
    --shadow-lift: 0 2px 4px rgba(23,33,43,.06), 0 14px 32px -10px rgba(23,33,43,.20);
    --font-body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --font-display:var(--font-body);
    --font-mono:'JetBrains Mono','Roboto Mono',ui-monospace,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink-900:#eef1ee; --ink-700:#cdd6d1; --ink-500:#93a29a; --ink-300:#657069;
      --paper-0:#141a17; --paper-50:#1a211d; --surface:#1f2721;
      --line:#333f37; --line-soft:#2a352d;
      --accent-900:#bfe9dd; --accent-700:#5fcdb4; --accent-500:#3aa88f; --accent-100:#20352f; --accent-050:#1b2b26;
      --cat-insp:#5fcdb4; --cat-insp-bg:#20352f;
      --cat-leave:#8db7e3; --cat-leave-bg:#1e2a38;
      --cat-att:#eec87a;  --cat-att-bg:#382c14;
      --danger-700:#f2a396; --danger-100:#3a231f;
      --warn-700:#eec87a;  --warn-100:#382c14;
      --good-700:#8fd6ab;  --good-100:#1c3324;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
      --shadow-lift: 0 2px 4px rgba(0,0,0,.4), 0 16px 36px -10px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink-900:#eef1ee; --ink-700:#cdd6d1; --ink-500:#93a29a; --ink-300:#657069;
    --paper-0:#141a17; --paper-50:#1a211d; --surface:#1f2721;
    --line:#333f37; --line-soft:#2a352d;
    --accent-900:#bfe9dd; --accent-700:#5fcdb4; --accent-500:#3aa88f; --accent-100:#20352f; --accent-050:#1b2b26;
    --cat-insp:#5fcdb4; --cat-insp-bg:#20352f;
    --cat-leave:#8db7e3; --cat-leave-bg:#1e2a38;
    --cat-att:#eec87a;  --cat-att-bg:#382c14;
    --danger-700:#f2a396; --danger-100:#3a231f;
    --warn-700:#eec87a;  --warn-100:#382c14;
    --good-700:#8fd6ab;  --good-100:#1c3324;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.4), 0 16px 36px -10px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper-0);color:var(--ink-900);font-family:var(--font-body);font-size:14px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  h1,h2,h3{font-weight:700;margin:0;color:var(--ink-900);text-wrap:balance;}
  a{color:var(--accent-700);}
  button{font-family:var(--font-body);}
  :focus-visible{outline:2px solid var(--accent-500);outline-offset:2px;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-900);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;}
  .btn:hover{border-color:var(--accent-500);color:var(--accent-700);}
  .btn.primary{background:var(--accent-700);border-color:var(--accent-700);color:#fff;}
  .btn.primary:hover{background:var(--accent-900);border-color:var(--accent-900);color:#fff;}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .hint{color:var(--ink-500);font-size:13px;margin:0;}

  /* ---------- auth ---------- */
  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 28px;}
  .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .f{display:flex;flex-direction:column;gap:10px;}
  .f input{border:1px solid var(--line);background:var(--paper-50);color:var(--ink-900);border-radius:9px;padding:10px 12px;font-size:14px;font-family:var(--font-body);}
  .f input:focus{outline:none;border-color:var(--accent-500);box-shadow:0 0 0 3px var(--accent-100);}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}

  /* ---------- shell ---------- */
  .gnb{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);}
  .gnb-inner{padding:0 40px;display:flex;align-items:center;gap:20px;height:60px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-900);flex-shrink:0;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent-700);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em;}
  .brand-name{font-weight:800;font-size:17px;letter-spacing:-.03em;}
  .brand-name small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-500);letter-spacing:.02em;line-height:1.1;}
  .cat-nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;}
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-nav a{flex-shrink:0;text-decoration:none;color:var(--ink-700);font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:999px;}
  .cat-nav a:hover{background:var(--paper-0);}
  .cat-nav a.on{background:var(--accent-100);color:var(--accent-900);}
  .user-box{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .user-chip{font-size:12.5px;color:var(--ink-700);font-weight:600;padding:5px 10px;border-radius:999px;background:var(--paper-0);text-decoration:none;}
  .user-chip:hover{color:var(--accent-700);}

  .shell{padding:36px 40px 80px;min-height:calc(100vh - 61px);}
  .crumb{font-size:12.5px;color:var(--ink-500);margin-bottom:6px;}
  .crumb a{color:var(--ink-500);text-decoration:none;}
  .crumb a:hover{color:var(--accent-700);}

  /* ---------- home ---------- */
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;}
  .hero .hint{margin-top:4px;}
  .svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;}
  .svc{position:relative;display:flex;flex-direction:column;gap:16px;min-height:240px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;text-decoration:none;color:var(--ink-900);transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .svc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--c);}
  .svc-icon{width:56px;height:56px;border-radius:14px;flex-shrink:0;background:var(--cbg);color:var(--c);display:grid;place-items:center;}
  .svc-icon svg{width:28px;height:28px;}
  .svc h2{font-size:20px;font-weight:800;letter-spacing:-.025em;}
  .svc p{margin:6px 0 0;font-size:14px;color:var(--ink-500);}
  .svc-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--c);}
  .badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--paper-0);color:var(--ink-500);border:1px solid var(--line-soft);}
  .home-note{margin-top:26px;}

  /* ---------- category page ---------- */
  .cat-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .cat-head h1{font-size:26px;font-weight:800;letter-spacing:-.03em;}
  .cat-head .hint{margin-top:2px;}
  .subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
  .subtabs::-webkit-scrollbar{display:none;}
  .subtabs a{flex-shrink:0;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink-500);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .subtabs a:hover{color:var(--ink-900);}
  .subtabs a.on{color:var(--c);border-bottom-color:var(--c);}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px;}
  .panel + .panel{margin-top:16px;}
  .panel h2{font-size:16px;margin-bottom:6px;}
  .empty{text-align:center;padding:80px 20px;}
  .empty .svc-icon{margin:0 auto 14px;}
  .empty h2{font-size:16px;margin-bottom:6px;}
  .empty .hint{max-width:420px;margin:0 auto;}
  .empty .actions{margin-top:18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
  .settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  .kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:13.5px;}
  .kv dt{color:var(--ink-500);}
  .kv dd{margin:0;word-break:break-all;}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink-900);color:var(--paper-0);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lift);z-index:100;}

  @media (max-width: 860px){
    .svc-grid{grid-template-columns:1fr;}
    .settings-grid{grid-template-columns:1fr;}
  }
  @media (max-width: 640px){
    .gnb-inner{flex-wrap:wrap;height:auto;padding:10px 16px 0;gap:8px 12px;}
    .brand{flex:1;}
    .cat-nav{order:3;flex-basis:100%;padding-bottom:8px;}
    .shell{padding:20px 16px 60px;}
    .hero h1{font-size:20px;}
    .user-chip{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=20261023-2"></script>
<script src="inspection.js?v=20261023-2"></script>
<script id="app-script" src="app.js?v=20261023-2"></script>
</body>
</html>
